<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Will you be my Valentine?</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg1: #ffd6e7;
      --bg2: #ffeef6;
      --card: #ffffffcc;
      --yes: #ff3b7a;
      --yesHover: #ff1f68;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      font-family: system-ui, sans-serif;
      overflow: hidden;
      padding: 16px;
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    .card {
      width: min(720px, 92vw);
      padding: 26px 22px;
      background: var(--card);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,.15);
      position: relative;
    }

    h1 {
      font-size: clamp(26px, 4vw, 44px);
      margin: 12px 0 18px;
    }

    .button-zone {
      position: relative;
      width: min(520px, 92%);
      height: 250px; /* Increased height for more running room */
      margin: 0 auto;
      touch-action: none;
    }

    button {
      position: absolute;
      top: 50%;
      padding: 16px 24px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,.14);
      user-select: none;
      transition: background .12s ease, left 0.15s ease, top 0.15s ease, opacity 1.5s ease;
    }

    #yesBtn {
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: var(--yes);
      color: #fff;
      opacity: 0;
      z-index: 10;
      pointer-events: none;
    }
    #yesBtn:hover { background: var(--yesHover); }

    #noBtn {
      left: 50%;
      transform: translate(-50%, -50%) scale(1.5);
      background: #e5e7eb;
      color: #111827;
      z-index: 5;
    }

    .hint {
      margin-top: 10px;
      font-size: 18px;
      font-weight: bold;
      color: var(--yes);
      opacity: .8;
      transition: font-size 0.2s ease;
    }

    .result {
      display: none;
      margin-top: 18px;
      animation: pop .35s ease;
    }

    .fireworks {
      width: min(350px, 80vw);
      max-height: 40vh; 
      object-fit: contain;
      margin: 0 auto;
      display: block;
      border-radius: 12px;
    }

    @keyframes pop {
      from { transform: scale(.96); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    
    #valentineMessage {
      font-size: clamp(20px, 3vw, 32px);
      color: var(--yes);
      margin: 10px 0 20px;
    }
  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>

  <main class="card">
    <p align="center">
      <img id="headerImg" src="https://github.com/gittyuser227382/Valentine/blob/main/IMG_5751.JPG?raw=true" width="200" height="200" alt="Header Image">
    </p>

    <h1>Chiara will you be my valentine?</h1>

    <section class="button-zone" id="zone">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </section>

    <div class="hint" id="hint">Please don't click no</div>

    <section class="result" id="result">
      <h2>YAY! 🎉</h2>
      <h3 id="valentineMessage">Happy Valentine's Day, Babe!</h3> 
      <img class="fireworks" src="https://github.com/gittyuser227382/Valentine/blob/main/IMG_1826.JPG?raw=true" alt="Fireworks" />
    </section>
  </main>

  <script>
    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const result = document.getElementById("result");
    const hint = document.getElementById("hint");

    let noScale = 1.5; 
    let yesScale = 0;
    let growthInterval = null;
    let hintSize = 18;
    let chaseCount = 0;

    const confettiCanvas = document.getElementById("confettiCanvas");
    function resizeConfettiCanvas() {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      confettiCanvas.width = Math.floor(window.innerWidth * dpr);
      confettiCanvas.height = Math.floor(window.innerHeight * dpr);
    }
    resizeConfettiCanvas();
    window.addEventListener("resize", resizeConfettiCanvas);

    const confettiInstance = confetti.create(confettiCanvas, { resize: false, useWorker: true });

    function fullScreenConfetti() {
      const end = Date.now() + 1600;
      (function frame() {
        confettiInstance({ particleCount: 12, spread: 90, startVelocity: 45, origin: { x: Math.random(), y: Math.random() * 0.3 } });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();
    }

    function startContinuousGrow() {
      if (growthInterval) return;
      yesBtn.style.opacity = "1";
      yesBtn.style.pointerEvents = "auto";
      yesScale = 1;

      growthInterval = setInterval(() => {
        yesScale += 0.04;
        if (noScale > 0.35) noScale -= 0.015;
        hintSize += 0.4;

        yesBtn.style.transform = `translate(-50%, -50%) scale(${yesScale})`;
        noBtn.style.transform = `translate(-50%, -50%) scale(${noScale})`;
        hint.style.fontSize = hintSize + "px";

        if (yesScale > 18) clearInterval(growthInterval);
      }, 100);
    }

    function moveNo(px, py) {
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      let dx = (b.left + b.width / 2) - px;
      let dy = (b.top + b.height / 2) - py;
      let mag = Math.hypot(dx, dy) || 1;
      
      // Triple jump distance (increased to 280) for a much longer chase
      let newLeft = (b.left - z.left) + (dx / mag) * 280;
      let newTop  = (b.top - z.top) + (dy / mag) * 280;

      newLeft = Math.max(0, Math.min(newLeft, z.width - b.width));
      newTop = Math.max(0, Math.min(newTop, z.height - b.height));

      noBtn.style.left = newLeft + "px";
      noBtn.style.top = newTop + "px";

      chaseCount++;
      
      // Progressive Hints for the long haul
      if (chaseCount === 10) hint.innerText = "You're surprisingly fast...";
      if (chaseCount === 20) hint.innerText = "Wow, still trying? 😂";
      if (chaseCount === 28) hint.innerText = "Almost... got... it...";
      
      if (chaseCount >= 30) {
        hint.innerText = "FINE, HAVE IT YOUR WAY! ❤️";
        startContinuousGrow();
      }
    }

    zone.addEventListener("pointermove", e => {
      const b = noBtn.getBoundingClientRect();
      const d = Math.hypot((b.left + b.width / 2) - e.clientX, (b.top + b.height / 2) - e.clientY);
      // Increased sensitivity (160) so it's even harder to catch
      if (d < 160) moveNo(e.clientX, e.clientY);
    });

    noBtn.addEventListener("click", e => e.preventDefault());

    yesBtn.addEventListener("click", () => {
      if (growthInterval) clearInterval(growthInterval);
      document.getElementById("headerImg").style.display = "none"; 
      document.querySelector("h1").style.display = "none";
      zone.style.display = "none";
      hint.style.display = "none";     
      result.style.display = "block";
      fullScreenConfetti();
    });
  </script>
</body>
</html>
