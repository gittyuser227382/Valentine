<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Will you be my Valentine?</title>

  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg1: #ffd6e7;
      --bg2: #ffeef6;
      --card: #ffffffcc;
      --yes: #ff3b7a;
      --yesHover: #ff1f68;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      font-family: system-ui, sans-serif;
      overflow: hidden;
      padding: 16px;
    }

    /* FULL-SCREEN CONFETTI CANVAS */
    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    .card {
      width: min(720px, 92vw);
      padding: 26px 22px;
      background: var(--card);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,.15);
    }

    .art {
      width: min(260px, 80vw);
      margin: 0 auto 10px;
      display: block;
      filter: drop-shadow(0 10px 14px rgba(0,0,0,.12));
    }

    h1 {
      font-size: clamp(26px, 4vw, 44px);
      margin: 12px 0 18px;
    }

    .button-zone {
      position: relative;
      width: min(520px, 92%);
      height: 150px;
      margin: 0 auto;
      touch-action: none;
    }

    button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 16px 24px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,.14);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .12s ease, background .12s ease;
    }

    #yesBtn {
  left: 50%;
  transform: translate(-50%, -50%) scale(0); /* Start scaled to 0 (invisible) */
  background: var(--yes);
  color: #fff;
  opacity: 0; /* Fully transparent */
  transition: transform .12s ease, background .12s ease, left 0.3s ease, opacity 0.3s ease;
}
    #yesBtn:hover { background: var(--yesHover); }

    #noBtn {
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%) scale(1.5); /* Starts bigger */
  background: #e5e7eb;
  color: #111827;
  transition: transform .12s ease, left 0.1s ease, top 0.1s ease; /* Smooth move and shrink */
}

    .hint {
      margin-top: 10px;
      font-size: 13px;
      opacity: .7;
    }

    .result {
      display: none;
      margin-top: 18px;
      animation: pop .35s ease;
    }

    .result h2 {
      font-size: clamp(30px, 4.5vw, 46px);
      margin: 10px 0;
    }

    .fireworks {
      width: min(380px, 90vw);
      margin: 0 auto;
      display: block;
    }

    @keyframes pop {
      from { transform: scale(.96); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    #valentineMessage {
      font-size: clamp(20px, 3vw, 32px);
      color: var(--yes);
      margin: 10px 0 20px;
    }
  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>

  <main class="card">
    <p align="center">
      <img id="headerImg" src="https://github.com/gittyuser227382/Valentine/blob/main/IMG_5751.JPG?raw=true" width="200" height="200" alt="Header Image">
    </p>

    <h1>Chiara will you be my valentine?</h1>

    <section class="button-zone" id="zone">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </section>

    <!-- HINT -->
    <div class="hint" id="hint">Please don't click no</div>

    <section class="result" id="result">
      <h2>YAY! 🎉</h2>
        <h3 id="valentineMessage">Happy Valentine's Day, Babe!</h3> 
      <img
        class="fireworks"
        src="https://github.com/gittyuser227382/Valentine/blob/main/IMG_1826.JPG?raw=true" width="350"
        alt="Fireworks"
      />
    </section>
  </main>

  <script>
    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const result = document.getElementById("result");
    const hint = document.getElementById("hint");

    let noScale = 1.5; 
    let yesScale = 1;
    let growthInterval = null;
    let hintSize = 18;

    /* ---------- CONFETTI ---------- */
    const confettiCanvas = document.getElementById("confettiCanvas");

    function resizeConfettiCanvas() {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      confettiCanvas.width = Math.floor(window.innerWidth * dpr);
      confettiCanvas.height = Math.floor(window.innerHeight * dpr);
      confettiCanvas.style.width = "100vw";
      confettiCanvas.style.height = "100vh";
    }

    resizeConfettiCanvas();
    window.addEventListener("resize", resizeConfettiCanvas);
    window.addEventListener("orientationchange", () => setTimeout(resizeConfettiCanvas, 150));

    const confettiInstance = confetti.create(confettiCanvas, {
      resize: false,
      useWorker: true
    });

    function fullScreenConfetti() {
      const end = Date.now() + 1600;

      (function frame() {
        confettiInstance({
          particleCount: 12,
          spread: 90,
          startVelocity: 45,
          ticks: 180,
          origin: { x: Math.random(), y: Math.random() * 0.3 }
        });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();

      setTimeout(() => {
        confettiInstance({
          particleCount: 300,
          spread: 140,
          startVelocity: 60,
          ticks: 220,
          origin: { x: 0.5, y: 0.55 }
        });
      }, 300);
    }

    /* ---------- YES BUTTON GROWS AND SLIDES TO CENTER ---------- */
let yesScale = 1;
let growthInterval = null;

function startContinuousGrow() {
  if (growthInterval) return;

  const hint = document.getElementById("hint");
  
  // Reveal the Yes button
  yesBtn.style.opacity = "1";
  yesBtn.style.left = "50%";
  yesScale = 1; // Ensure it starts at normal size

  growthInterval = setInterval(() => {
    yesScale += 0.05;
    hintSize += 0.5;
    
    yesBtn.style.transform = `translate(-50%, -50%) scale(${yesScale})`;
    hint.style.fontSize = hintSize + "px";
    
    if (yesScale > 20) clearInterval(growthInterval);
  }, 100); 
}

    /* ---------- NO BUTTON RUNS AWAY ---------- */
    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    function moveNo(px, py) {
  const z = zone.getBoundingClientRect();
  const b = noBtn.getBoundingClientRect();

  let dx = (b.left + b.width / 2) - px;
  let dy = (b.top + b.height / 2) - py;
  let mag = Math.hypot(dx, dy) || 1;
  dx /= mag;
  dy /= mag;

  let newLeft = (b.left - z.left) + dx * 150;
  let newTop  = (b.top - z.top) + dy * 150;

  newLeft = clamp(newLeft, 0, z.width - b.width);
  newTop  = clamp(newTop, 0, z.height - b.height);

  noBtn.style.left = newLeft + "px";
  noBtn.style.top = newTop + "px";
  // REMOVED: noBtn.style.transform = "none"; (This allows the shrink to work)

  startContinuousGrow(); 
}

  // REPLACE growYes() WITH THIS:
  function startContinuousGrow() {
  if (growthInterval) return;

  const hint = document.getElementById("hint");
  yesBtn.style.opacity = "1";
  yesBtn.style.left = "50%";

  growthInterval = setInterval(() => {
    // Grow Yes
    yesScale += 0.05;
    yesBtn.style.transform = `translate(-50%, -50%) scale(${yesScale})`;

    // Shrink No (slowly down to a minimum of 0.3)
    if (noScale > 0.3) {
      noScale -= 0.02; 
      noBtn.style.transform = `scale(${noScale})`;
    }

    // Grow Hint
    hintSize += 0.5;
    hint.style.fontSize = hintSize + "px";

    if (yesScale > 20) clearInterval(growthInterval);
  }, 100); 
}

    noBtn.addEventListener("click", e => e.preventDefault());

    /* ---------- YES CLICK ---------- */
    yesBtn.addEventListener("click", () => {
      clearInterval(growthInterval); // STOP THE GROWTH
      document.getElementById("headerImg").style.display = "none"; 
      document.querySelector("h1").style.display = "none";
      zone.style.display = "none";
      hint.style.display = "none";     
      result.style.display = "block";
      resizeConfettiCanvas();
      fullScreenConfetti();
    });
  </script>
</body>
</html>
